name: Manual Build - macOS

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - arm64
          - x64

permissions:
  contents: read

concurrency:
  group: macos-manual-${{ github.ref }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    if: ${{ inputs.arch == 'all' || inputs.arch == 'arm64' }}
    name: Build libmpv (macOS / arm64)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      MPV_TARGET_ARCH: arm64
      VCPKG_TARGET_TRIPLET: arm64-osx-mp
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_FORCE_SYSTEM_BINARIES: 1
    steps:
      - uses: actions/checkout@v6

      - name: Show build environment
        run: |
          xcodebuild -version
          uname -m
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          echo "MPV_TARGET_ARCH=$MPV_TARGET_ARCH"
          echo "VCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install meson ninja
          FORMULAE=(pkgconf autoconf autoconf-archive automake libtool nasm)
          MISSING=()
          for f in "${FORMULAE[@]}"; do
            if ! brew list --formula "$f" >/dev/null 2>&1; then
              MISSING+=("$f")
            fi
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            brew update
            brew install -q "${MISSING[@]}"
          fi

      - name: Preflight tool checks
        run: |
          set -euo pipefail
          for tool in nasm pkg-config meson ninja; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool: $tool" >&2
              exit 1
            fi
          done
          nasm -v | head -n 1 || true
          pkg-config --version
          meson --version
          ninja --version

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            ~/Library/Caches/vcpkg/archives
          key: ${{ runner.os }}-arm64-osx-mp-vcpkg-${{ hashFiles('bootstrap-vcpkg.sh', 'install-vcpkg-deps.sh', 'vcpkg-triplets/*.cmake', 'vcpkg-ports/**') }}
          restore-keys: |
            ${{ runner.os }}-arm64-osx-mp-vcpkg-

      - name: Bootstrap vcpkg
        run: bash ./bootstrap-vcpkg.sh

      - name: Install vcpkg dependencies
        env:
          VCPKG_SKIP_BOOTSTRAP: 1
        run: bash ./install-vcpkg-deps.sh

      - name: Download mpv source code
        run: bash ./download.sh

      - name: Build FFmpeg from source
        run: bash ./build-ffmpeg.sh

      - name: Build mpv library
        run: bash ./build-macos.sh

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          LABEL="manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          PKG_NAME="libmpv-${LABEL}-macos-arm64"
          bash ./package-macos-runtime.sh \
            --build-dir "$GITHUB_WORKSPACE/vendor/mpv/buildout" \
            --out-dir "$GITHUB_WORKSPACE/release" \
            --pkg-name "$PKG_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-manual-macos-arm64-${{ github.run_number }}
          path: |
            libmpv-*.tar.gz
            libmpv-*.tar.gz.sha256
          compression-level: 0

  macos-x64:
    if: ${{ inputs.arch == 'all' || inputs.arch == 'x64' }}
    name: Build libmpv (macOS / x64)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      MPV_TARGET_ARCH: x86_64
      VCPKG_TARGET_TRIPLET: x64-osx-mp
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_FORCE_SYSTEM_BINARIES: 1
    steps:
      - uses: actions/checkout@v6

      - name: Show build environment
        run: |
          xcodebuild -version
          uname -m
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          echo "MPV_TARGET_ARCH=$MPV_TARGET_ARCH"
          echo "VCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install meson ninja
          FORMULAE=(pkgconf autoconf autoconf-archive automake libtool nasm)
          MISSING=()
          for f in "${FORMULAE[@]}"; do
            if ! brew list --formula "$f" >/dev/null 2>&1; then
              MISSING+=("$f")
            fi
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            brew update
            brew install -q "${MISSING[@]}"
          fi

      - name: Preflight tool checks
        run: |
          set -euo pipefail
          for tool in nasm pkg-config meson ninja; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool: $tool" >&2
              exit 1
            fi
          done
          nasm -v | head -n 1 || true
          pkg-config --version
          meson --version
          ninja --version

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            ~/Library/Caches/vcpkg/archives
          key: ${{ runner.os }}-x64-osx-mp-vcpkg-${{ hashFiles('bootstrap-vcpkg.sh', 'install-vcpkg-deps.sh', 'vcpkg-triplets/*.cmake', 'vcpkg-ports/**') }}
          restore-keys: |
            ${{ runner.os }}-x64-osx-mp-vcpkg-

      - name: Bootstrap vcpkg
        run: bash ./bootstrap-vcpkg.sh

      - name: Install vcpkg dependencies
        env:
          VCPKG_SKIP_BOOTSTRAP: 1
        run: bash ./install-vcpkg-deps.sh

      - name: Download mpv source code
        run: bash ./download.sh

      - name: Build FFmpeg from source
        run: bash ./build-ffmpeg.sh

      - name: Build mpv library
        run: bash ./build-macos.sh

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          LABEL="manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          PKG_NAME="libmpv-${LABEL}-macos-x64"
          bash ./package-macos-runtime.sh \
            --build-dir "$GITHUB_WORKSPACE/vendor/mpv/buildout" \
            --out-dir "$GITHUB_WORKSPACE/release" \
            --pkg-name "$PKG_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-manual-macos-x64-${{ github.run_number }}
          path: |
            libmpv-*.tar.gz
            libmpv-*.tar.gz.sha256
          compression-level: 0
